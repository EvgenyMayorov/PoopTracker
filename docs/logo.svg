<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="rollShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#022C22" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Фон иконки -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <g filter="url(#softShadow)">
    <!-- Свисающая лента бумаги, переходящая в нижнюю часть с галочкой -->
    <path d="M 140 165 L 140 365 C 140 385 154 398 174 398 L 318 398 C 338 398 352 385 352 365 L 352 165 Z" fill="#FFFFFF"/>

    <!-- Линия перфорации на ленте -->
    <line x1="156" y1="242" x2="336" y2="242" stroke="#CBD5E1" stroke-width="4" stroke-dasharray="10 10" stroke-linecap="round"/>

    <!-- Изумрудно-зелёная галочка (Checkmark) на размотанном листе -->
    <path d="M 196 316 L 234 354 L 306 276" fill="none" stroke="#10B981" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Основной цилиндр рулона сверху -->
    <rect x="140" y="114" width="232" height="106" rx="34" fill="url(#rollShade)"/>
    <ellipse cx="338" cy="167" rx="34" ry="53" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="3"/>

    <!-- Картонная втулка с торца рулона -->
    <ellipse cx="338" cy="167" rx="16" ry="26" fill="#D97706"/>
    <ellipse cx="340" cy="167" rx="11" ry="19" fill="#92400E"/>
  </g>
</svg>