<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="poopGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#008CDF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066AA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#F7FBFE"/>
  
  <!-- Poop base -->
  <ellipse cx="256" cy="340" rx="120" ry="40" fill="url(#poopGradient)"/>
  
  <!-- Poop middle layer -->
  <ellipse cx="256" cy="290" rx="100" ry="35" fill="url(#poopGradient)"/>
  
  <!-- Poop top layer -->
  <ellipse cx="256" cy="245" rx="80" ry="30" fill="url(#poopGradient)"/>
  
  <!-- Poop peak -->
  <path d="M 256 180 Q 270 200 256 220 Q 242 200 256 180" fill="url(#poopGradient)"/>
  
  <!-- Eyes -->
  <circle cx="230" cy="280" r="12" fill="#FFFFFF"/>
  <circle cx="282" cy="280" r="12" fill="#FFFFFF"/>
  <circle cx="230" cy="282" r="6" fill="#020618"/>
  <circle cx="282" cy="282" r="6" fill="#020618"/>
  
  <!-- Smile -->
  <path d="M 230 310 Q 256 325 282 310" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Sparkles -->
  <circle cx="150" cy="180" r="4" fill="#008CDF" opacity="0.6"/>
  <circle cx="362" cy="200" r="3" fill="#008CDF" opacity="0.6"/>
  <circle cx="380" cy="320" r="5" fill="#008CDF" opacity="0.6"/>
  <circle cx="132" cy="300" r="3" fill="#008CDF" opacity="0.6"/>
</svg>
