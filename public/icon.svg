<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#581c87"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="180" fill="none" stroke="#06b6d4" stroke-width="4" opacity="0.3"/>
  </g>
  <text x="256" y="320" font-size="280" text-anchor="middle" fill="#8b4513">💩</text>
  <text x="256" y="440" font-size="48" text-anchor="middle" fill="#06b6d4" font-family="Arial, sans-serif" font-weight="bold">PoopTracker</text>
</svg>
